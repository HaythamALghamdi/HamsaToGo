name: hamsa_flutter
description: Hamsa To Go — Coffee Ordering App
publish_to: 'none'
version: 1.1.5+22

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  # Upgraded together as one family. firebase_messaging 16.5+ is required for
  # the iOS UIScene lifecycle (mandatory when building with the iOS 27 SDK):
  # older versions silently stop delivering foreground push notifications and
  # can fail to obtain an APNs token once the app adopts UIScene.
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_messaging: ^16.7.0
  firebase_app_check: ^0.4.8
  firebase_crashlytics: ^5.4.0

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Fonts & styling
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # Network
  dio: ^5.4.3+1

  # Payments
  # 3.0.5 fixes a crash handling the native Apple Pay result (the token map
  # from the platform channel was used unconverted) and replaces the `pay`
  # package with a native PassKit implementation.
  moyasar: ^3.0.5
  webview_flutter: ^4.14.0   # 3DS challenge for saved-card (token) charges

  # PDF reports (staff daily report export)
  pdf: ^3.11.1
  printing: ^5.13.4

  # Storage
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.2

  # Images
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2

  # Utilities
  # Caret (not an exact pin) so it resolves to whatever intl the bundled
  # flutter_localizations needs — newer Flutter (e.g. Codemagic's stable)
  # requires intl 0.20.3, which an exact 0.20.2 pin blocked.
  intl: ^0.20.2
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

# ─── App Icon generation (run: dart run flutter_launcher_icons) ───
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"            # 1024×1024 master (2.jpg)
  android: true
  ios: true
  remove_alpha_ios: true                        # App Store rejects icons with alpha
  adaptive_icon_background: "#FFFFFF"           # matches the icon's white background
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"  # padded logo, white margins

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # Bundled so the PDF report can load it via rootBundle (offline, reliable).
    - assets/fonts/NotoSansArabic-Regular.ttf

  fonts:
    - family: Peignot
      fonts:
        - asset: assets/fonts/PeignotDemi.otf
          weight: 600
    - family: Noor
      fonts:
        - asset: assets/fonts/NoorRegular.ttf
          weight: 400
